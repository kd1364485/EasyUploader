<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyUploader</title>
    <script type="module" crossorigin src="/assets/index-CmDsm_HB.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BDzg0Uoy.css">
  </head>

  <body class="bg-gray-900 text-gray-100 min-h-screen">
    <main class="container mx-auto px-4 py-12 max-w-2xl">
      <h1 class="text-5xl font-bold text-center mb-12 py-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-500">
        EasyUploader
      </h1>

      <div class="bg-gray-800 rounded-2xl p-8 shadow-2xl mb-8 border border-gray-700">
        <div class="flex justify-center mb-6">
          <button id="select-folder-btn" type="button" class="px-6 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105 hover:shadow-lg hover:shadow-purple-500/25">
            フォルダを選択
          </button>
        </div>
        <p id="selected-path" class="mb-6 p-4 bg-gray-900 rounded-lg font-mono text-sm text-gray-300 break-all border border-gray-700">
          選択されたパス: なし
        </p>
        <div class="flex justify-center">
          <button id="generate-zip-btn" type="button" disabled class="px-6 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105 hover:shadow-lg hover:shadow-purple-500/25 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none">
            テキストファイルを生成
          </button>
        </div>
        <p id="zip-status" class="mt-4 text-center text-gray-300"></p>
      </div>

      <div class="bg-gray-800 rounded-2xl p-8 shadow-2xl border border-gray-700">
        <h2 class="text-2xl font-bold mb-6 text-gray-100">拡張子設定</h2>
        <div class="flex flex-col gap-4">
          <div id="extensions-tags" class="flex flex-wrap gap-2 min-h-16 p-4 bg-gray-900 border border-gray-700 rounded-lg">
            <!-- タグがここに動的に追加されます -->
          </div>
          <div class="flex gap-2">
            <input id="extension-input" type="text" placeholder="拡張子を入力（例: js）" class="flex-1 px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-300" />
            <button id="add-extension-btn" type="button" class="px-6 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105 hover:shadow-lg hover:shadow-purple-500/25">
              追加
            </button>
          </div>
          <div class="flex justify-center gap-4">
            <button id="load-extensions-btn" type="button" class="px-6 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105 hover:shadow-lg hover:shadow-purple-500/25 min-w-40 text-center">
              設定を読み込み
            </button>
            <button id="save-extensions-btn" type="button" class="px-6 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105 hover:shadow-lg hover:shadow-purple-500/25 min-w-40 text-center">
              設定を保存
            </button>
          </div>
          <p id="extensions-status" class="text-center text-gray-300"></p>
        </div>
      </div>
    </main>
  </body>
</html>
